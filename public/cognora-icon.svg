<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cgBorder" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="35%" stop-color="#A855F7"/>
      <stop offset="70%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="cgBg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0C0E1E"/>
      <stop offset="100%" stop-color="#070914"/>
    </linearGradient>
    <linearGradient id="cgLeftRibbon" x1="20" y1="18" x2="45" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="20%" stop-color="#C084FC"/>
      <stop offset="55%" stop-color="#8B5CF6"/>
      <stop offset="85%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="cgTopCrest" x1="38" y1="16" x2="76" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="35%" stop-color="#60A5FA"/>
      <stop offset="75%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="cgInnerShadow" x1="24" y1="24" x2="50" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="cgPageTop" x1="36" y1="76" x2="82" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="85%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="cgPageUnder" x1="36" y1="80" x2="76" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="60%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Container with Neon Gradient Border -->
  <rect x="3" y="3" width="94" height="94" rx="26" fill="url(#cgBg)" stroke="url(#cgBorder)" stroke-width="2.4"/>

  <!-- Subtle Top Glow Sheen -->
  <path d="M 28 4 Q 50 2 72 4" stroke="#818CF8" stroke-width="1" opacity="0.4" stroke-linecap="round"/>

  <!-- Inner Deep Shadow Fold of the C -->
  <path d="M 44 20 C 32 24 23 36 23 50 C 23 62 29 72 38 78 C 31 70 27 58 27 48 C 27 36 34 26 44 20 Z" fill="url(#cgInnerShadow)"/>

  <!-- Left Dimensional Ribbon (Lavender to Violet to Deep Indigo) -->
  <path d="M 48 16 C 30 16 18 30 18 48 C 18 64 26 74 36 78 C 32 70 24 60 24 48 C 24 34 32 23 48 17.5 Z" fill="url(#cgLeftRibbon)"/>

  <!-- Top Ribbon Arch & Crest (Violet to Electric Cyan) -->
  <path d="M 44 16 C 56 16 68 20 76 28 C 72 33 63 38 57 37 C 49 30 42 23 35 18 C 38 16.8 41 16 44 16 Z" fill="url(#cgTopCrest)"/>
  <path d="M 42 16.5 C 50 17 62 20 74 27 C 76 28.5 75 30 73 31 C 66 35 58 37 54 36 C 46 29 40 23 35 18.5 Z" fill="#60A5FA" opacity="0.7"/>

  <!-- Book Pages at bottom of C -->
  <!-- Under/Lower Page -->
  <path d="M 36 78 C 48 76 62 72 74 68 C 76 70 75 73 72 74.5 C 60 77.5 48 80.5 36 78 Z" fill="url(#cgPageUnder)"/>
  <!-- Top Page Fluttering (Curling open to the right) -->
  <path d="M 36 76 C 46 68 60 62 78 56 C 81 58 79.5 61 76 63.5 C 62 67 48 72 36 76 Z" fill="url(#cgPageTop)"/>
  <!-- Page tip notched curl detail -->
  <path d="M 78 56 L 82.5 59 L 76 63.5 Z" fill="#7DD3FC"/>

  <!-- Neural Constellation (4 Synaptic Connected Nodes) -->
  <!-- Constellation Connections -->
  <g filter="url(#glow)">
    <path d="M 60 39 L 71 44 L 63 54 L 52 48 Z" stroke="#38BDF8" stroke-width="1.8" stroke-linejoin="round" opacity="0.95" fill="none"/>
    <path d="M 52 48 L 71 44" stroke="#60A5FA" stroke-width="1.1" opacity="0.7" fill="none"/>
  </g>

  <!-- Constellation Nodes -->
  <circle cx="60" cy="39" r="3.4" fill="#BAE6FD" stroke="#0284C7" stroke-width="1"/>
  <circle cx="71" cy="44" r="3.4" fill="#BAE6FD" stroke="#0284C7" stroke-width="1"/>
  <circle cx="63" cy="54" r="3.4" fill="#BAE6FD" stroke="#0284C7" stroke-width="1"/>
  <circle cx="52" cy="48" r="3.4" fill="#BAE6FD" stroke="#0284C7" stroke-width="1"/>

  <!-- Bright Core Centers of Nodes -->
  <circle cx="60" cy="39" r="1.4" fill="#FFFFFF"/>
  <circle cx="71" cy="44" r="1.4" fill="#FFFFFF"/>
  <circle cx="63" cy="54" r="1.4" fill="#FFFFFF"/>
  <circle cx="52" cy="48" r="1.4" fill="#FFFFFF"/>
</svg>